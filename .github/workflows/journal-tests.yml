name: Recovery journal regression tests

on:
  push:
    paths:
      - 'src/journal_validation.py'
      - 'src/process_patch.py'
      - 'tests/test_journal_validation.py'
      - '.github/workflows/journal-tests.yml'
  pull_request:
    paths:
      - 'src/journal_validation.py'
      - 'src/process_patch.py'
      - 'tests/test_journal_validation.py'
      - '.github/workflows/journal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run journal validation tests
        run: python -m unittest discover -s tests -p 'test_journal_validation.py' -v
