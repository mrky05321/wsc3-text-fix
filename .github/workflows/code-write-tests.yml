name: Remote code write fault-injection tests

on:
  push:
    paths:
      - 'src/process_patch.py'
      - 'tests/test_code_write.py'
      - '.github/workflows/code-write-tests.yml'
  pull_request:
    paths:
      - 'src/process_patch.py'
      - 'tests/test_code_write.py'
      - '.github/workflows/code-write-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight runtime test dependency
        run: python -m pip install psutil==7.0.0
      - name: Run fault-injection tests
        run: python -m unittest discover -s tests -p 'test_code_write.py' -v
