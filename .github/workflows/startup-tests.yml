name: Startup-only regression tests
on:
  push:
    paths: ['src/launcher.py', 'tests/**', '.github/workflows/startup-tests.yml']
  pull_request:
    paths: ['src/launcher.py', 'tests/**', '.github/workflows/startup-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - run: python -m unittest discover -s tests -v
