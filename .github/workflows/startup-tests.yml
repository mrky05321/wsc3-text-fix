name: v0.1.1 linewrap and startup regression tests
on:
  push:
    paths: ['src/**', 'tests/**', 'requirements-test.txt', '.github/workflows/startup-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'requirements-test.txt', '.github/workflows/startup-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
        env:
          WSC3_RUN_FIXTURE: '1'
