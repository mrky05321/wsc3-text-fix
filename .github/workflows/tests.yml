name: Pure Python regression tests

on:
  push:
    paths:
      - 'src/hook_code.py'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/hook_code.py'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Hook encoder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install runtime dependency for optional Windows API tests
        run: python -m pip install psutil==7.0.0
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
